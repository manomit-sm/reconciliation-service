services:
  - docker:dind

stages:
  - build
  - build_docker
  - clean
  - sonarqube-check
  - sonarqube-vulnerability-report

variables:
  APPLICATION_NAME: "moac-reconciliation-service"
  TAGNAME: "1.0.0"
  MAVEN_CLI_OPTS: "-s .m2/settings.xml --batch-mode"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository
    - target/

build application:
  image: maven:3.9.7-sapmachine-22
  stage: build
  script:
    - chmod +x ./mvnw
    - ./mvnw package -DskipTests
  artifacts:
    paths:
      - target/moac-reconciliation-service-1.0.0-SNAPSHOT.jar
      - target/

build_docker application:
  image: docker:20.10.21-alpine3.17
  stage: build_docker
  services:
    - docker:20.10.21-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  # TODO: confirm/replace the per-branch TAGNAME values below once this service has its own
  # release versioning scheme (copied placeholder pattern from moac-doc-gen-service).
  rules:
  - if: ($CI_COMMIT_BRANCH == "master" || $CI_COMMIT_REF_NAME == "master")
    variables:
      TAGNAME: "1.0.0"
  - if: ($CI_COMMIT_BRANCH == "qa" || $CI_COMMIT_REF_NAME == "qa")
    when: never
  - if: ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_REF_NAME == "develop")
    variables:
      TAGNAME: "1.0.0-develop"
  - if: ($CI_COMMIT_BRANCH == "test" || $CI_COMMIT_REF_NAME == "test")
    when: never
  script:
    - apk add --update --no-cache curl py-pip
    - pip install awscli
    - docker build -f Dockerfile -t $APPLICATION_NAME .
    - docker tag $APPLICATION_NAME:latest 589969446963.dkr.ecr.eu-west-1.amazonaws.com/pilim/$APPLICATION_NAME:$TAGNAME
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin 589969446963.dkr.ecr.eu-west-1.amazonaws.com
    - docker push 589969446963.dkr.ecr.eu-west-1.amazonaws.com/pilim/$APPLICATION_NAME:$TAGNAME
    - docker rmi 589969446963.dkr.ecr.eu-west-1.amazonaws.com/pilim/$APPLICATION_NAME:$TAGNAME
    - docker rmi $APPLICATION_NAME:latest

sonarqube-check:
  image: maven:3.8.6-openjdk-18-slim
  stage: sonarqube-check
  cache:
    policy: pull
    key: "${CI_COMMIT_SHORT_SHA}"
    paths:
      - sonar-scanner/
  script:
    - mvn $MAVEN_CLI_OPTS verify sonar:sonar
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'developer'

sonarqube-vulnerability-report:
  image: maven:3.8.6-openjdk-18-slim
  stage: sonarqube-vulnerability-report
  # TODO: replace projectKey with this service's own SonarQube project key once registered -
  # left blank rather than reusing another service's key.
  script:
    - 'curl -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/issues/gitlab_sast_export?projectKey=${SONAR_PROJECT_KEY}&branch=${CI_COMMIT_BRANCH}&pullRequest=${CI_MERGE_REQUEST_IID}" -o gl-sast-sonar-report.json'
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'developer'
  artifacts:
    expire_in: 1 day
    reports:
      sast: gl-sast-sonar-report.json
